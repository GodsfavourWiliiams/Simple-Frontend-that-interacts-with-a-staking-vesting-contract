<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staking and Vesting</title>
    <style>
      :root { --bg:#f6f7f9; --card:#fff; --text:#14161a; --muted:#6b7280; --accent:#4f46e5; --line:#e5e7eb; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0e1013; --card:#171a1f; --text:#eef0f3; --muted:#9aa3af; --accent:#818cf8; --line:#262b33; } }
      body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
      .wrap { max-width:720px; margin:0 auto; padding:24px 16px; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
      .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
      .stat small { color:var(--muted); display:block; } .stat b { font-size:1.15rem; }
      .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
      input { flex:1; min-width:120px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
      button { padding:8px 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
      button.alt { background:transparent; color:var(--accent); border:1px solid var(--accent); }
      button:disabled { opacity:.5; cursor:not-allowed; }
      .err { color:#dc2626; } .ok { color:#16a34a; } h2 { margin:0 0 8px; font-size:1.05rem; } .pos { padding:10px 0; border-top:1px solid var(--line); } .pos small { color:var(--muted); }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
